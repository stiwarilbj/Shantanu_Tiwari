<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A place for experiments, games, things to learn, and projects from the archive">
  <title>Project Lab</title>
  <link rel="stylesheet" href="./assets/site.css?v=3">
  <link rel="stylesheet" href="./assets/project-previews.css">
  <link rel="icon" href="assets/favicon.ico" sizes="16x16 32x32 48x48 64x64">
  <script type="module" src="./navbar/navbar.js?v=28" blocking="render"></script>
  <script type="module" src="./assets/project-previews.js"></script>
</head>
<body>
  <header data-site-navbar></header>
  <main>
    <div class="lab">
      <header class="hero content">
        <h1>Project Lab</h1>
        <p>A place for experiments, games, things to learn, and projects from the archive</p>
      </header>
      <section class="showcase content" aria-labelledby="showcase-title">
        <h2 id="showcase-title">Project Showcase</h2>
        <div class="project-tiles">
          <article class="tile project-tile project-preview" data-project-preview="places-game">
            <a class="project-preview-link" href="learning/places-game/">
              <span class="project-preview-heading">
                <span class="tile-title">Place Naming Game</span>
                <span class="tile-arrow" aria-hidden="true">→</span>
              </span>
            </a>
          </article>
          <a class="tile project-tile" href="projects/project-2/">
            <span class="tile-title">Project 2</span>
            <span class="tile-arrow" aria-hidden="true">→</span>
          </a>
          <a class="tile project-tile" href="projects/project-3/">
            <span class="tile-title">Project 3</span>
            <span class="tile-arrow" aria-hidden="true">→</span>
          </a>
        </div>
      </section>
    </div>
    <section class="explore" aria-labelledby="explore-title">
      <div class="explore-art" aria-hidden="true"></div>
      <div class="content">
        <h2 id="explore-title">Explore</h2>
        <div class="explore-tiles">
          <a class="tile explore-tile" href="experiments/">
            <span class="tile-copy">
              <span class="tile-title">Experiments</span>
              <span class="tile-description">Prototypes and ideas to try</span>
            </span>
            <span class="tile-arrow" aria-hidden="true">→</span>
          </a>
          <a class="tile explore-tile" href="learning/">
            <span class="tile-copy">
              <span class="tile-title">Learning</span>
              <span class="tile-description">Notes and walkthroughs</span>
            </span>
            <span class="tile-arrow" aria-hidden="true">→</span>
          </a>
          <a class="tile explore-tile" href="games/">
            <span class="tile-copy">
              <span class="tile-title">Games</span>
              <span class="tile-description">Small games to play</span>
            </span>
            <span class="tile-arrow" aria-hidden="true">→</span>
          </a>
          <a class="tile explore-tile" href="old-projects/">
            <span class="tile-copy">
              <span class="tile-title">Old Projects</span>
              <span class="tile-description">Earlier builds</span>
            </span>
            <span class="tile-arrow" aria-hidden="true">→</span>
          </a>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
